[package]
name = "markii-gpui"
version = "0.8.0"
edition = "2021"
description = "Mark II PC monitor - native GPUI front end"

[[bin]]
name = "markii"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
markii-core = { path = "../markii-core" }
notify-rust = "4"
png = "0.17"
raw-window-handle = "0.6"
serde_json = "1"
sysinfo = "0.33"
# SteamVR overlay: openvr_api is loaded at runtime, the panel is drawn in software
libloading = "0.8"
# updater: checks the downloaded release zip
sha2 = "0.10"
tiny-skia = "0.11"
ab_glyph = "0.2"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"
