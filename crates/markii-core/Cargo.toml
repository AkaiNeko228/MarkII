[package]
name = "markii-core"
version = "0.1.0"
edition = "2021"
description = "Mark II data collection: sysinfo, NVML, HWiNFO, PDH clocks, WMI identity, alerts"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
nvml-wrapper = "0.10"
regex = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Performance"] }
