[workspace]
resolver = "2"
members = ["crates/markii-core", "crates/markii-gpui", "src-tauri"]

[profile.release]
opt-level = 3
lto = "thin"

# GPUI is very slow unoptimized; optimize dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

# gpui 0.2.2 pulls xattr 0.2.3 (via zed-async-tar), which no longer builds on
# Linux with current libc (ENOATTR was removed there; it equals ENODATA).
[patch.crates-io]
xattr = { path = "vendor/xattr-0.2.3" }
